# API gateway de Nora: único punto de entrada. Enruta, limita peticiones y añade cabeceras de seguridad.
# CORS lo gestiona el backend (NORA_ALLOWED_ORIGINS); con este gateway el frontal y la API comparten origen.
worker_processes auto;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Límites por IP
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api:10m  rate=30r/s;
    limit_req_zone $binary_remote_addr zone=ws:10m   rate=60r/m;
    limit_conn_zone $binary_remote_addr zone=conn:10m;
    limit_req_status 429;
    limit_conn_status 429;

    # Cabecera Connection para WebSocket (solo en /ws)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Si delante hay un proxy con TLS (Cloudflare Tunnel, Caddy, Traefik…) llega X-Forwarded-Proto: https
    map $http_x_forwarded_proto $forwarded_proto {
        default $scheme;
        https   https;
    }

    upstream backend  { server backend:8080; keepalive 16; }
    upstream frontend { server frontend:8080; }

    server {
        listen 8080;
        client_max_body_size 1m;
        client_body_timeout 30s;
        limit_conn conn 40;

        # Cabeceras de seguridad (no añadir add_header dentro de los location: anularía estas)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

        # Login / registro / refresh: protección frente a fuerza bruta
        location /api/auth/ {
            limit_req zone=auth burst=10 nodelay;
            include /etc/nginx/proxy_api.conf;
            proxy_pass http://backend;
        }

        # Subida de archivos: cuerpo grande y sin buffering en disco del gateway
        location ~ ^/api/rooms/[^/]+/files/?$ {
            limit_req zone=api burst=60 nodelay;
            client_max_body_size 2g;
            client_body_timeout 600s;
            proxy_request_buffering off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            include /etc/nginx/proxy_api.conf;
            proxy_pass http://backend;
        }

        # Trozos de subida reanudable (8 MiB cada uno): cuerpo acotado y sin buffering en disco
        location ~ ^/api/rooms/[^/]+/uploads/[^/]+/parts/[0-9]+$ {
            limit_req zone=api burst=100 nodelay;
            client_max_body_size 9m;
            client_body_timeout 120s;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            include /etc/nginx/proxy_api.conf;
            proxy_pass http://backend;
        }

        # WebSocket en tiempo real (presencia, eventos, progreso). Se autentica con un ticket de un solo uso.
        location = /ws {
            limit_req zone=ws burst=20 nodelay;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_buffering off;
            proxy_read_timeout 3700s;
            proxy_send_timeout 3700s;
            proxy_pass http://backend;
        }

        # Documentos colaborativos: importar/exportar (conversión con LibreOffice, tarda) e instantáneas
        location ~ ^/api/rooms/[^/]+/docs/ {
            limit_req zone=api burst=60 nodelay;
            client_max_body_size 40m;
            proxy_read_timeout 180s;
            proxy_send_timeout 180s;
            proxy_buffering off;
            include /etc/nginx/proxy_api.conf;
            proxy_pass http://backend;
        }

        location /api/ {
            limit_req zone=api burst=60 nodelay;
            proxy_buffering off;
            include /etc/nginx/proxy_api.conf;
            proxy_pass http://backend;
        }

        # Nada de actuator ni otros endpoints internos hacia el exterior
        location /actuator { return 404; }

        location / {
            proxy_set_header Host $http_host;
            proxy_pass http://frontend;
        }
    }
}
