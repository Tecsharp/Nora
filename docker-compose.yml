# Nora — arranque: ./setup.sh (Linux/macOS) o ./setup.ps1 (Windows). Solo el gateway publica un puerto.
name: nora

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

services:
  db:
    <<: *hardening
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nora
      POSTGRES_USER: nora
      POSTGRES_PASSWORD: "${NORA_DB_PASSWORD:?Falta .env, ejecuta ./setup.sh}"
    volumes:
      - nora_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nora -d nora"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]
    cap_add: [CHOWN, SETUID, SETGID, FOWNER, DAC_OVERRIDE]

  garage:
    <<: *hardening
    image: dxflrs/garage:v1.0.1
    environment:
      GARAGE_RPC_SECRET: "${NORA_GARAGE_RPC_SECRET:?Falta .env, ejecuta ./setup.sh}"
      GARAGE_ADMIN_TOKEN: "${NORA_GARAGE_ADMIN_TOKEN:?Falta .env, ejecuta ./setup.sh}"
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - nora_garage_meta:/var/lib/garage/meta
      - nora_garage_data:/var/lib/garage/data
    read_only: true
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]   # sin puertos publicados y sin salida a Internet: solo la API llega aquí

  backend:
    <<: *hardening
    build: ./backend
    depends_on:
      db: { condition: service_healthy }
      garage: { condition: service_healthy }
    environment:
      NORA_DB_HOST: db
      NORA_DB_PASSWORD: ${NORA_DB_PASSWORD}
      NORA_JWT_SECRET: "${NORA_JWT_SECRET:?Falta .env, ejecuta ./setup.sh}"
      NORA_GARAGE_ADMIN_TOKEN: "${NORA_GARAGE_ADMIN_TOKEN}"
      NORA_CONVERTER_URL: http://converter:3100
      NORA_CONVERTER_TOKEN: "${NORA_CONVERTER_TOKEN:-}"
      NORA_ADMIN_EMAIL: ${NORA_ADMIN_EMAIL:-}
      NORA_ADMIN_PASSWORD: ${NORA_ADMIN_PASSWORD:-}
      NORA_ALLOWED_ORIGINS: ${NORA_ALLOWED_ORIGINS:-}
      NORA_ALLOW_REGISTRATION: ${NORA_ALLOW_REGISTRATION:-true}
      NORA_COOKIE_SECURE: ${NORA_COOKIE_SECURE:-false}
      NORA_DEFAULT_STORAGE_QUOTA_MB: ${NORA_DEFAULT_STORAGE_QUOTA_MB:-1024}
      NORA_DEFAULT_MAX_FILE_MB: ${NORA_DEFAULT_MAX_FILE_MB:-100}
      NORA_DEFAULT_ROOM_MINUTES: ${NORA_DEFAULT_ROOM_MINUTES:-120}
      NORA_DEFAULT_MAX_ROOMS: ${NORA_DEFAULT_MAX_ROOMS:-5}
      NORA_DEFAULT_MAX_PARTICIPANTS: ${NORA_DEFAULT_MAX_PARTICIPANTS:-25}
      # Asistencia (ver/controlar pantalla): servidores para que los navegadores se conecten entre sí. Sin TURN funciona en la misma red y en la
      # mayoría de redes domésticas; con redes más estrictas (empresas, 4G) conviene activar el servicio coturn (perfil «turn», ver README).
      NORA_STUN_URLS: ${NORA_STUN_URLS:-stun:stun.l.google.com:19302}
      NORA_TURN_URLS: ${NORA_TURN_URLS:-}
      NORA_TURN_SECRET: ${NORA_TURN_SECRET:-}
    read_only: true
    tmpfs:
      - /tmp:size=1g
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [edge, internal]

  # Convierte archivos de oficina (DOCX/ODT, XLSX/ODS/CSV, PPTX/ODP) a formato editable y de vuelta con LibreOffice.
  # Procesa archivos de usuarios (no confiables): solo red interna, sin salida a Internet, sistema de ficheros de solo lectura.
  converter:
    <<: *hardening
    build: ./converter
    environment:
      CONVERTER_TOKEN: "${NORA_CONVERTER_TOKEN:-}"
      LO_PARALLEL: "2"
    read_only: true
    tmpfs:
      - /tmp:size=1g
    mem_limit: 1536m
    pids_limit: 256
    networks: [internal]

  frontend:
    <<: *hardening
    build: ./frontend
    read_only: true
    tmpfs:
      - /tmp
    networks: [edge]

  gateway:
    <<: *hardening
    build:
      context: .
      dockerfile: gateway/Dockerfile
    depends_on:
      backend: { condition: service_healthy }
      frontend: { condition: service_started }
    ports:
      - "${NORA_BIND:-0.0.0.0}:${NORA_PORT:-29817}:8080"
    volumes:
      - ./agent/dist:/srv/extra/downloads:ro   # p. ej. nora-agent-macos (compilado en un Mac con agent/build.sh); ver agent/README.md
    read_only: true
    tmpfs:
      - /tmp
    networks: [edge]

  # Servidor TURN para Asistencia (opcional): ayuda a conectar a las personas que están detrás de redes estrictas.
  # Se activa con:  docker compose --profile turn up -d   y definiendo NORA_TURN_URLS=turn:TU-IP:3478 y NORA_TURN_SECRET en .env.
  # Usa la red del equipo (necesita un rango de puertos UDP para retransmitir); abre 3478 y 49160-49200 (UDP) en el cortafuegos.
  coturn:
    profiles: ["turn"]
    image: coturn/coturn:4.6
    restart: unless-stopped
    network_mode: host
    command: >
      -n --realm=nora --use-auth-secret --static-auth-secret=${NORA_TURN_SECRET:-} --listening-port=3478
      --min-port=49160 --max-port=49200 --fingerprint --no-cli --no-tls --no-dtls --no-multicast-peers
      --denied-peer-ip=10.0.0.0-10.255.255.255 --denied-peer-ip=172.16.0.0-172.31.255.255 --denied-peer-ip=192.168.0.0-192.168.255.255

networks:
  edge: {}
  internal:
    internal: true   # sin acceso a Internet ni al exterior

volumes:
  nora_pgdata: {}
  nora_garage_meta: {}
  nora_garage_data: {}
