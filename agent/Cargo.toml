[package]
name = "nora-agent"
version = "0.1.0"
edition = "2021"
description = "Agente de escritorio de Nora: permite que alguien de tu sala controle tu equipo mientras lo permites"
license = "MIT"

[dependencies]
enigo = "0.6"
tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
ureq = { version = "2", features = ["json"] }
serde_json = "1"
dirs = "5"
url = "2"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
