# Análisis de calidad con SonarQube / SonarCloud (ver docs/CALIDAD.md). Lo lanza .github/workflows/sonar.yml.
# La clave y la organización de SonarCloud se pasan desde el flujo (variables del repositorio), no se fijan aquí.
sonar.projectKey=Tecsharp_Nora
sonar.projectName=Nora
sonar.sourceEncoding=UTF-8

# Código a analizar: backend (Java), frontend (TypeScript) y agente de escritorio (Rust, si tu edición de Sonar lo soporta)
sonar.sources=backend/src/main/java,frontend/src,agent/src
sonar.tests=backend/src/test
sonar.java.binaries=backend/target/classes
sonar.java.source=21

# Fuera del análisis: dependencias, compilaciones, estilos y datos generados
sonar.exclusions=**/node_modules/**,**/dist/**,**/target/**,**/*.css,**/*.excalidraw,docs/**
sonar.coverage.exclusions=frontend/**,agent/**
