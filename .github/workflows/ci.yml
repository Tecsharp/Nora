name: CI

# Comprueba en cada cambio que todo compila: backend (Maven), frontend (TypeScript + Vite) y agente (Rust).
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compilar y probar
        run: mvn -B -ntp verify

  frontend:
    name: Frontend (TypeScript + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Tipos y compilación
        run: npm run build

  agent:
    name: Agente (Rust)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias de Linux (X11)
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libxdo-dev libx11-dev libxcb1-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            agent/target
          key: agent-${{ runner.os }}-${{ hashFiles('agent/Cargo.lock') }}
      - name: Comprobar
        run: cargo check --locked

  compose:
    name: Docker Compose (validación)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar docker-compose.yml con el .env de ejemplo
        run: cp .env.example .env && docker compose config -q
