name: Calidad (SonarQube)

# Analiza el código con SonarCloud (gratis para repositorios públicos) o con tu propio SonarQube. No necesita Jenkins:
# el análisis lo hace este flujo de GitHub Actions. Mientras no existan el secreto SONAR_TOKEN, se salta sin fallar.
# Cómo configurarlo, paso a paso: docs/CALIDAD.md
on:
  push:
    branches: [main, develop]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  sonar:
    name: Análisis
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: ¿Está configurado Sonar?
        id: cfg
        run: |
          if [ -n "$SONAR_TOKEN" ]; then echo "on=true" >> "$GITHUB_OUTPUT"; else echo "No hay secreto SONAR_TOKEN: se omite el análisis (ver docs/CALIDAD.md)." >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.on == 'true'
        with:
          fetch-depth: 0 # Sonar necesita el historial para atribuir el código nuevo
      - uses: actions/setup-java@v4
        if: steps.cfg.outputs.on == 'true'
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compilar el backend (Sonar analiza las clases)
        if: steps.cfg.outputs.on == 'true'
        working-directory: backend
        run: mvn -B -ntp -DskipTests package
      - name: Analizar
        if: steps.cfg.outputs.on == 'true'
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
        with:
          args: >
            ${{ vars.SONAR_ORGANIZATION && format('-Dsonar.organization={0}', vars.SONAR_ORGANIZATION) || '' }}
            ${{ vars.SONAR_PROJECT_KEY && format('-Dsonar.projectKey={0}', vars.SONAR_PROJECT_KEY) || '' }}
            -Dsonar.qualitygate.wait=true
